# ============================================================
#  Perfil "supabase": la base de datos es Supabase (PostgreSQL en la nube)
#  Se activa con:  gradlew bootRun --args=--spring.profiles.active=supabase
#  (o con iniciar-microservicios.bat, que lo activa solo si existe supabase.properties)
# ============================================================

# Los datos de conexión NO van en el código: se leen del archivo microservicios/supabase.properties
# (copiar supabase.properties.ejemplo y completar con los datos del proyecto de Supabase)
spring.config.import=optional:file:../supabase.properties

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase limita las conexiones del plan gratis: un pool chico alcanza para la app
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=20000

# Las tablas las crea supabase/schema.sql; si no se corrió, Hibernate las crea igual
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.h2.console.enabled=false
