spring.application.name=ms-usuarios
server.port=8081

# Base de datos H2 en archivo: los datos quedan guardados en ./data aunque se apague el servicio
spring.datasource.url=jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web para revisar las tablas: http://localhost:8081/h2-console
# JDBC URL: jdbc:h2:file:./data/usuarios  usuario: sa  (sin clave)
spring.h2.console.enabled=true
